; ملحوظة مهمة عن أونلاين/أوفلاين: مفيش داعي لبناءين منفصلين.
; نفس الـ APK/EXE فيه الوضعين وبيختار اللاعب بينهم من شاشة الدخول
; (ConnectionMenu.gd) وقت ما يفتح اللعبة، ويقدر يبدّل لاحقاً كمان.
; أوفلاين = بدون سيرفر خالص، كله محفوظ على الجهاز.
; أونلاين = يكتب IP سيرفر Oracle/مؤجر (أو 127.0.0.1 لو نفس الجهاز)
; ويتصل بيه؛ لو فشل الاتصال، اللعبة ترجع أوفلاين تلقائياً من غير ما تقفل.
